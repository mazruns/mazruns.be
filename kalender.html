<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Ooit moest Maziar Toghraie vluchten uit Iran. Op 1 maart 2027 loopt hij terug: van Leuven naar Iran, elke dag een marathon.">
<meta property="og:type" content="website">
<meta property="og:title" content="Kalender · Mazruns">
<meta property="og:description" content="Ooit moest Maziar Toghraie vluchten uit Iran. Op 1 maart 2027 loopt hij terug: van Leuven naar Iran, elke dag een marathon.">
<meta property="og:image" content="https://mazruns.be/assets/img/hero-dunes.jpg">
<meta property="og:url" content="https://mazruns.be/kalender.html">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<title>Kalender · Mazruns</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Vazirmatn:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="kalender">
<header class="nav" id="hdr"></header>
<main>
<section class="hero on-photo short">
  <img src="assets/img/field-sun.jpg" alt="" style="object-position:50% 60%" fetchpriority="high">
  <div class="wrap"><div class="over">
    <p class="label" data-t="cal.crumb">Kalender</p>
    <h1><span data-t="cal.title">Wanneer</span></h1>
    <p class="lede" data-t="cal.lede">Wat vastligt en wat nog volgt. Zodra de route bekend is, krijgt elk land hier een eigen kleur.</p>
    <div class="cta-row"></div>
  </div></div>
</section>
<section class="band"><div class="wrap two" style="display:grid;gap:3rem">
  <div>
    <div class="cal-head">
      <button id="calPrev" data-t-aria="cal.prev" aria-label="Vorige maand">‹</button>
      <h3 id="calMonth"></h3>
      <button id="calNext" data-t-aria="cal.next" aria-label="Volgende maand">›</button>
    </div>
    <div class="cal" id="cal" role="grid"></div>
    <p class="legend" style="margin-top:1.2rem"><span><i style="background:var(--accent)"></i><span data-t="cal.legend.event">evenement</span></span><span><i style="box-shadow:inset 0 0 0 2px var(--ink)"></i><span data-t="cal.legend.today">vandaag</span></span></p>
    <p class="legend" id="calCountries" style="margin-top:.6rem"></p>
  </div>
  <div class="stack lg">
    <div class="stack"><p class="label" data-t="cal.upcoming">Binnenkort</p></div>
    <div class="cards" style="grid-template-columns:1fr" id="eventList"></div>
  </div>
</div></section>
<section class="band dark"><div class="wrap news">
  <p class="label" data-t="news.title">Loop mee in je mailbox</p>
  <h2 data-t="news.p">Af en toe een mail van onderweg. Meer niet.</h2>
  <form id="newsForm"><input id="newsMail" type="email" required data-t-ph="news.ph" placeholder="je@mail.be" aria-label="E-mail"><button class="btn" type="submit" data-t="news.btn">Inschrijven</button></form>
  <p class="toast" id="newsToast" hidden></p>
</div></section>
</main>
<footer id="ftr"></footer>
<script src="assets/content.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
