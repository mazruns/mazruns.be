<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Ooit moest Maziar Toghraie vluchten uit Iran. Op 1 maart 2027 loopt hij terug: van Leuven naar Iran, elke dag een marathon.">
<meta property="og:type" content="website">
<meta property="og:title" content="Vlog · Mazruns">
<meta property="og:description" content="Ooit moest Maziar Toghraie vluchten uit Iran. Op 1 maart 2027 loopt hij terug: van Leuven naar Iran, elke dag een marathon.">
<meta property="og:image" content="https://mazruns.be/assets/img/hero-dunes.jpg">
<meta property="og:url" content="https://mazruns.be/vlog.html">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<title>Vlog · Mazruns</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Vazirmatn:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="vlog">
<header class="nav" id="hdr"></header>
<main>
<section class="hero on-photo short">
  <img src="assets/img/dune-wide.jpg" alt="" style="object-position:50% 50%" fetchpriority="high">
  <div class="wrap"><div class="over">
    <p class="label" data-t="vlog.crumb">Vlog</p>
    <h1><span data-t="vlog.title">Volg de tocht</span></h1>
    <p class="lede" data-t="vlog.lede">Elke etappe een korte video. Abonneer op het kanaal en mis geen kilometer.</p>
    <div class="cta-row"><a class="btn fill" href="https://www.youtube.com/@maz.runs" data-t="vlog.sub">Abonneer op YouTube</a></div>
  </div></div><span class="credit">© Marathon des Sables</span>
</section>
<section class="band"><div class="wrap">
  <div id="vlogFeatured"></div>
</div></section>
<section class="band alt"><div class="wrap stack lg">
  <div class="head"><div class="stack"><p class="label" data-t="vlog.all">Alle video's</p></div><a class="link" href="https://www.youtube.com/@maz.runs" data-t="vlog.more">Alle video's op YouTube</a></div>
  <div class="tiles three" id="vlogCards"></div>
</div></section>
<section class="band dark"><div class="wrap news">
  <p class="label" data-t="news.title">Loop mee in je mailbox</p>
  <h2 data-t="news.p">Af en toe een mail van onderweg. Meer niet.</h2>
  <form id="newsForm"><input id="newsMail" type="email" required data-t-ph="news.ph" placeholder="je@mail.be" aria-label="E-mail"><button class="btn" type="submit" data-t="news.btn">Inschrijven</button></form>
  <p class="toast" id="newsToast" hidden></p>
</div></section>
</main>
<footer id="ftr"></footer>
<script src="assets/content.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
