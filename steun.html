<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ooit moest Maziar Toghraie vluchten uit Iran. Op 1 maart 2027 loopt hij terug: van Leuven naar Iran, elke dag een marathon.">
<meta property="og:type" content="website">
<meta property="og:title" content="Steun · Mazruns">
<meta property="og:description" content="Ooit moest Maziar Toghraie vluchten uit Iran. Op 1 maart 2027 loopt hij terug: van Leuven naar Iran, elke dag een marathon.">
<meta property="og:image" content="https://mazruns.be/assets/img/hero-dunes.jpg">
<meta property="og:url" content="https://mazruns.be/steun.html">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<title>Steun · Mazruns</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Vazirmatn:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="steun">
<header class="nav" id="hdr"></header>
<main>
<section class="hero on-photo short">
  <img src="assets/img/sand-kick.jpg" alt="" style="object-position:60% 22%" fetchpriority="high">
  <div class="wrap"><div class="over">
    <p class="label" data-t="fund.crumb">Steun</p>
    <h1><span data-t="fund.title">Koop een kilometer</span></h1>
    <p class="lede" data-t="fund.lede">Een deel van elke bijdrage dekt de tocht. De rest gaat naar een vzw. Welke, maken we binnenkort bekend.</p>
    <div class="cta-row"></div>
  </div></div><span class="credit">© Marathon des Sables</span>
</section>
<section class="band"><div class="wrap stack lg">
  <div>
    <div class="meter"><i id="meterBar"></i></div>
    <div class="amounts"><span id="raised">€ 0</span><span id="goal" data-t="fund.goal">doel: nog te bepalen</span></div>
  </div>
  <ul class="tiers" id="tiers"></ul>
  <p class="note" data-t="fund.note"></p>
</div></section>
<section class="band dark"><div class="wrap quote">
  <blockquote data-t="fund.quote"></blockquote>
  <cite data-t="story.cite">Maziar</cite>
</div></section>
<section class="band alt"><div class="wrap two" style="display:grid;gap:3rem">
  <div class="stack">
    <p class="label" data-t="fund.split">Waar je bijdrage naartoe gaat</p>
    <div class="split"><div><b id="splitA">50%</b><span data-t="fund.split.a">de tocht</span></div><div><b id="splitB">50%</b><span data-t="fund.split.b">de vzw</span></div></div>
    <p class="note" data-t="fund.split.note">verdeling voorlopig</p>
  </div>
  <div>
    <details><summary data-t="ffaq.q1"></summary><p data-t="ffaq.a1"></p></details>
    <details><summary data-t="ffaq.q2"></summary><p data-t="ffaq.a2"></p></details>
    <details><summary data-t="ffaq.q3"></summary><p data-t="ffaq.a3"></p></details>
  </div>
</div></section>

</main>
<footer id="ftr"></footer>
<script src="assets/content.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
